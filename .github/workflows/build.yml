
name: Build C++ EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++
        run: cl /EHsc /std:c++17 /Fe:pesanan.exe main.cpp

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: pesanan.exe
